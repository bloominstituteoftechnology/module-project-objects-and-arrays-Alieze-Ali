  <script>
    // In CHALLENGEs 1-9 you will flesh out some functions

    // To do this, translate each 🧠 set of instructions into a working function

    // 👉 CHALLENGE 1
    // 🧠 The function buildPeter builds an object of a certain shape and returns it.
    // 🧠 Example of usage:
    // buildPeter() // should return { firstName: "Peter", lastName: "Pan", age: 12 }
    function buildPeter() {
      // Solution A:
      // Step 1: Declare an empty object of peter
      // Step 2: assign values to peter with . notation
      // Step 3: return peter
      // Step 4: call buildPeter
      // Step 5: Note: you do not need to pass arguments bc you are returning SPECIFIC values, not values that will change everytime the function is called - duh! 
      // Stretch: Clear the console and call the function to test
      // let peter = {}
      // peter.firstName = 'Peter';
      // peter.lastName = 'Pan';
      // peter.age = 12;

      // return peter;

        // Solution B: Short hand
        // Step 1: return object with key value pairs hardcoded
        return {
          firstName: 'Peter',
          lastName: 'Pan',
          age: 12
        }
      
    }
  

    // 👉 CHALLENGE 2
    // 🧠 The function buildUser takes three arguments and uses them to build an object and return it.
    // 🧠 Example of usage:
    // buildUser("John", "Smith", 30) // should return { firstName: "John", lastName: "Smith", age: 30 }
    function buildUser(firstName, lastName, age) {
      // Method 1
      // Step 1: Define the object by passing the arguments
      // Step 2: Return arguments literal using shorthand notation
      // Step 3: call function in console to check
      
      // return { firstName, lastName, age }

      // Method 2
      // Step 1: declare a variable, assign it to an empty object
      // Step 2: Set 3 properties on the newly created object using . notiation
      // Step 3: assign them to the corresponding arguments
      // Step 4: return the result object     
      // Stretch: call buildUser("John", "Smith", 30) in console to check
      let user = {};
      user.firstName = firstName;
      user.lastName = lastName;
      user.age = age;

      return user;

    }
   // buildUser("John", "Smith", 30);

    // 👉 CHALLENGE 3
    // 🧠 The function deletePrice takes an object as its argument and deletes its "price" property if it exists.
    // 🧠 If on the other hand there is no "price" property on the object, a "priceless" property with a value of true is added to it.
    // 🧠 After the modification of the object, it is returned.
    // 🧠 Note that the argument of the function is missing, you must write it.
    // 🧠 Examples of usage:
    // deletePrice({ item: "Tesla Model 3", price: 40000 }) // should return { item: "Tesla Model 3" }
    // deletePrice({ item: "Kobo Libra 2" }) // should return { item: "Kobo Libra 2", priceless: true }
    function deletePrice(obj) {
      // Step 1: pass in your object argument
      // Step 3: create first if statement: 
        // a: if the object's price is not undefined: 
        // b: delete the objects price 
          // note: use the 'delete' key word
          // note: use . notation to access the price
          // note: test the function in the console with price of 0: deletePrice({price: 0})
          // price should delete when function price is tested
      // Step 4: add else logic: if object (key) priceless (value) is true 
        // note: else logic goes straight into {}
      // Step 5: Return the object
      // Stretch: test deletePrice({ item: "Tesla Model 3", price: 40000 }) & ({ item: "Kobo Libra 2" }) in console
      if (obj.price !== undefined) {
        delete obj.price;
      } else {
        obj.priceless = true;
      }
      return obj;
     
    }

    // 👉 CHALLENGE 4
    // 🧠 The function evenList takes an array as its argument and returns true if the array has an even number of elements, false otherwise.
    // 🧠 Note that the argument of the function is missing, you must write it.
    // 🧠 Examples of usage:
    // evenList(['a']) // should return false
    // evenList(['a', 'b']) // should return true
    function evenList(arr) {
      // Step 1: Pass your array argument
      // Step 2: Build your 1st if statement: 
        // if array.length % 2 === 0; then return true
      // Step 3: else return false;
      // Alieze's logic
      // if (arr.length % 2 === 0) {
      //   return true; 
      // } else {
      //   return false;
      // }

      // Gabe's logic #1
      let numOfElements = arr.length
      let isEven = numOfElements % 2 === 0
      if (isEven) {
      return true
      }
      return false;

      // Gabe's shorthand logic:
      // return arr.length % 2 === 0;

    }

    // 👉 CHALLENGE 5
    // 🧠 The function firstOrLast takes an array as the first argument, and a Boolean as the second.
    // 🧠 If the Boolean is true, the function returns the first element of the array, otherwise the last one.
    // 🧠 Examples of usage:
    // firstOrLast(['a', 'b'], true) // should return 'a'
    // firstOrLast(['a', 'b'], false) // should return 'b'
    function firstOrLast(arr, bool) {
      // Step 1: pass arguments
      // Step 2: Build if statement: if bool === true, return arr[0];
      // Step 3: else: return arr.at(-1)
        // note: if you are testing truthiness, it is already implied
        // note: if only one comparison with 2 options, you can skip the 'else' statement and go right to the return
      // Step 4: Test the examples of usage in console
      // Woohoo!! 
      if (bool) {
        return arr[0];
      }
        return arr.at(-1);
    
    }

    // 👉 CHALLENGE 6
    // 🧠 The function pushElement takes an array as the first argument, and any value we wish as the second.
    // 🧠 The function adds the given value as the last element of the array, and then returns the whole array.
    // 🧠 Examples of usage:
    // pushElement([], 1) // should return [1]
    // pushElement(['a', 'b'], 'c') // should return ['a', 'b', 'c']
    function pushElement(arr, val) {
      // Step 1: pass array and any value arguments
      // Step 2: Assign the last element of the array to val, the new last element
        // note: avoid using the push() method for now
        // note: we use arr[arr.length] because this is the element that doesn't exist yet, it is outside of the original array, so we don't need a -1. This adds an extra element to the existing array.
      // Step 3: Return the array (the original argument)
      // Step 4: Take it for a drive in the console
      arr[arr.length] = val;  
      return arr; 

    }

    // 👉 CHALLENGE 7
    // 🧠 The function stripX takes a string as its argument.
    // 🧠 The function strips any occurrences of the letter "x" from the string and returns the resulting string.
    // 🧠 Examples of usage:
    // stripX("xenomorph") // should return "enomorph"
    // stripX("paradox") // should return "parado"
    // ❗ Important Hints:
    // 🧠 Inside the function, we should split the given string into an array of characters. Example: "foo".split("") yields ["f", "o", "o"]
    // 🧠 Do not attempt to manipulate the array of characters. Create an empty result array, and populate it by looping over the characters.
    // 🧠 At each iteration of the loop, if the current character is not "x", then add it to the end of the result array.
    // 🧠 You can merge the result array back into a string by using join. Example: ["f", "o", "o"].join("") yields "foo"
    // 🧠 Do not forget to return your rejoined string!
    function stripX(str) {
      // Step 1: pass argument - str
      // Step 2: Create empty result array
      // Step 3: Split the string into an array of characters, assign to a variable (splitStr)
        // note: test your splitStr var with a console.log in the function to make sure string is splitting
        // Note: test your function thus far in the console with stripX('foo') to check if the str is splitting
      // Step 4: loop over the indices (idx) in split with for/let loop
      // Step 5: Declare a variable for characters assign it to splitStr index array; this will grab the index of the characters in the array
        // a: take a moment to test function with console.log(char, splitStr)
        // b: take a beat to test drive the function stripX('foo') in the console
        // c: test console.log(idx, splitStr[idx]) in your function
        // d: test stripX('foo') again & make sure you're getting chars on your indices
      // Step 5: add your conditional if statement logic: 
        // a: if char !== 'x': add it to new array and the new arrays length array & assign that to char
        // b: console.log(result) to test
        // c: run stripX('foo') in console
      // Step 6: return your result array & attach the join key method with . notation

      let result = []
      let splitStr = str.split('')
      //console.log(splitStr)
      for (let idx in splitStr) {
        let char = splitStr[idx]
        //console.log(char, splitStr)
        //console.log(idx, splitStr[idx])
        if (char !== 'x') {
          result[result.length] = char
          //console.log(result)
        }
       
      }
      return result.join('');
     
    }

    // 👉 CHALLENGE 8
    // 🧠 The function stripChar takes a string as its first argument and a character as its second argument.
    // 🧠 The function strips any occurrences of the given character from the string and returns the resulting string.
    // 🧠 Examples of usage:
    // stripChar("xenomorph", "x") // should return "enomorph"
    // stripChar("paradox", "a") // should return "prdox"
    // ❗ Important Notes:
    // 🧠 Try to solve this problem without looking at how you solved the previous one.
    // 🧠 If you need to look, do not copy & paste code. Take a peek and then work from memory!

    // Step 1: Pass Arguments
    // Step 2: Declare a result array
    // Step 3: Split the string into an array of characters
      // Step 3a: Assign the split string to a var called splitStr
      // Step 3b: test your splitStr var with console.log(splitStr)
    // Step 4: Add for/let loop to loop over characters in arrays 
    // Step 5: At each iteration - Declare a new character variable; assign it to the index of the splitStr variable
      // Step 5a: console.log(char, splitStr) console.log(idx, splitStr[idx]) 
      // Step 5b: run the function in the console
    // Step 6: Add conditional logic:
      // Step 6a: if the new character !== char: strip that character : 
      // Step 6b: add remaining characters to result array, result.length
      // Step 6c: assign the results to the new character array
    // Step 7: Return result array joined back together with .join('')
    // Woe!!
    function stripChar(str, char) {
      let result = []
      let splitStr = str.split('')
      //  console.log(splitStr)
      for (let idx in splitStr) {
        let character = splitStr[idx]
        // console.log(char, splitStr)
        // console.log(idx, splitStr[idx]) 
        if (character !== char) {
          result[result.length] = character
           //console.log(result)
        }
      }
      return result.join('');
    }

    // 👉 CHALLENGE 9
    // 🧠 The function getProps takes an object as its argument.
    // 🧠 The function returns an array containing the property names of the object.
    // 🧠 However, if the properties "age" or "married" come up, do not include them in the returned array.
    // 🧠 Avoid using the delete operator in your implementation. We don't wish to alter the object!
    // 🧠 Examples of usage:
    // getProps({ lastName: "Smith", age: 35 }) // should return ["lastName"]
    // getProps({ firstName: "Jane", married: false }) // should return ["firstName"]
    // getProps({ name: "Bamby", favFood: "flowers" }) // should return ["name", "favFood"]

    // Step 1: pass obj argument
    // Step 2: declare an empty array for the results (array of property names)
    // Step 3: Loop over object with for/let 
    // Step 4: Add conditional logic: 
      // Step 4a: if key does not equal 'age' and if key does not equal 'married'
      // Step 4b: Include it in the result set's result.length array
      // Step 4c: assign the results to the key
    function getProps(obj) {
      //console.log(obj)
      let result = []
      for (let key in obj) {
        if (key !== 'age' && key !== 'married') {
          result[result.length] = key
        }
      }
      return result;
    }
   

    // 🧪 TESTS, do not work below this line
    // 🧪 TESTS, do not work below this line
    // 🧪 TESTS, do not work below this line
    runTests('CHALLENGE 1 - buildPeter', buildPeter, [
      [[], { firstName: "Peter", lastName: "Pan", age: 12 }],
    ])
    runTests('CHALLENGE 2 - buildUser', buildUser, [
      [["John", "Smith", 30], { firstName: "John", lastName: "Smith", age: 30 }],
      [["Jane", "Doe", 25], { firstName: "Jane", lastName: "Doe", age: 25 }],
    ])
    runTests('CHALLENGE 3 - deletePrice', deletePrice, [
      [[{ item: "Tesla Model 3", price: 40000 }], { item: "Tesla Model 3" }],
      [[{ item: "Friends and family", price: 0 }], { item: "Friends and family" }],
      [[{ item: "Kobo Libra 2" }], { item: "Kobo Libra 2", priceless: true }],
    ])
    runTests('CHALLENGE 4 - evenList', evenList, [
      [[[]], true],
      [[['a']], false],
      [[['a', 'b']], true],
    ])
    runTests('CHALLENGE 5 - firstOrLast', firstOrLast, [
      [[['a', 'b'], true], 'a'],
      [[['a', 'b', 'c'], false], 'c'],
    ])
    runTests('CHALLENGE 6 - pushElement', pushElement, [
      [[[], 1], [1]],
      [[['a', 'b', 'c'], 'd'], ['a', 'b', 'c', 'd']],
    ])
    runTests('CHALLENGE 7 - stripX', stripX, [
      [['extracorporeal'], 'etracorporeal'],
      [['counterexample'], 'countereample'],
      [['xoxo'], 'oo'],
      [['x'], ''],
    ])
    runTests('CHALLENGE 8 - stripChar', stripChar, [
      [['extracorporeal', 'x'], 'etracorporeal'],
      [['counterexample', 'e'], 'countrxampl'],
      [['xoxo', 'o'], 'xx'],
      [['x', 'x'], ''],
    ])
    runTests('CHALLENGE 9 - getProps', getProps, [
      [[{ lastName: "Smith", age: 35 }], ["lastName"]],
      [[{ firstName: "Jane", married: false }], ["firstName"]],
      [[{ firstName: "Jane", married: true, age: 65 }], ["firstName"]],
      [[{ name: "Bamby", favFood: "flowers" }], ["name", "favFood"]],
    ])
    function runTests(testName, func, tests) {
      let results = []
      tests.forEach(test => {
        const argsList = test[0]
        const expected = JSON.stringify(test[1])
        const actual = JSON.stringify(func.apply(null, JSON.parse(JSON.stringify(argsList))))
        results.push([argsList, expected, actual])
      })
      console.log('\n' + testName)
      if (results.every(result => result[1] === result[2])) console.log('\t✅ All tests pass')
      else results.forEach((result, idx) => {
        if (result[1] === result[2]) console.log(`\t✅ Test ${idx + 1} passes`)
        else console.log(`\t❌ Test ${idx + 1} fails: ${func.name}(${result[0]
          .map(JSON.stringify)}) should return ${result[1]} but returns ${result[2]}`)
      })
    }
  </script>
